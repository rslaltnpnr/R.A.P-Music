name: Android release (signed APK/AAB)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version name from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            --stacktrace

      - name: Rename outputs
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/*.apk "release-out/OzinMusic-v${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "release-out/OzinMusic-v${{ steps.version.outputs.version_name }}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OZIN Music ${{ steps.version.outputs.tag }}
          files: |
            release-out/OzinMusic-v${{ steps.version.outputs.version_name }}.apk
            release-out/OzinMusic-v${{ steps.version.outputs.version_name }}.aab
