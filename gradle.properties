org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Single place to control the app's display name; also mirrored into
# app/src/main/res/values/strings.xml (app_name) by the build via resValue.
appName=OZIN Music

# Overridable from the CLI / CI, e.g. -PversionName=1.2.3
versionName=0.1.0
